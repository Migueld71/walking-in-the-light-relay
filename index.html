<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Walking in the Light Radio</title>

  <meta name="theme-color" content="#07111f">
  <link rel="manifest" href="/manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, #17345c 0%, #0b1d33 38%, #050b14 100%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .player {
      width: 100%;
      max-width: 420px;
      padding: 38px 28px 32px;
      text-align: center;
      border-radius: 28px;
      background: rgba(10, 24, 42, 0.92);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 24px 70px rgba(0,0,0,0.45);
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      margin-bottom: 24px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ff4057;
      box-shadow: 0 0 12px #ff4057;
    }

    h1 {
      font-size: 30px;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9eb2ca;
      font-size: 15px;
      margin-bottom: 34px;
    }

    .now-playing {
      padding: 20px;
      margin-bottom: 28px;
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
    }

    .now-label {
      margin-bottom: 9px;
      color: #6eb8ff;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    #songTitle {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    #artist {
      margin-top: 7px;
      color: #aebed0;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .play-button {
      width: 92px;
      height: 92px;
      border: none;
      border-radius: 50%;
      background: white;
      color: #07111f;
      font-size: 35px;
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(0,0,0,0.4);
    }

    .play-button:active {
      transform: scale(0.96);
    }

    #status {
      min-height: 20px;
      margin-top: 20px;
      color: #9eb2ca;
      font-size: 13px;
    }

    .footer {
      margin-top: 28px;
      color: #60758e;
      font-size: 11px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <main class="player">

    <div class="live">
      <span class="dot"></span>
      LIVE RADIO
    </div>

    <h1>Walking in the Light</h1>
    <div class="subtitle">Radio</div>

    <section class="now-playing">
      <div class="now-label">NOW PLAYING</div>
      <div id="songTitle">Walking in the Light Radio</div>
      <div id="artist">Live Stream</div>
    </section>

    <button
      id="playButton"
      class="play-button"
      type="button"
      aria-label="Play radio"
    >
      ▶
    </button>

    <div id="status">Tap play to listen</div>

    <div class="footer">
      WALKING IN THE LIGHT RADIO • 24/7
    </div>

  </main>

  <audio id="radio" preload="none">
    <source src="/stream" type="audio/mpeg">
  </audio>

  <script>
    const radio = document.getElementById("radio");
    const playButton = document.getElementById("playButton");
    const statusText = document.getElementById("status");
    const songTitle = document.getElementById("songTitle");
    const artist = document.getElementById("artist");

    let playing = false;

    playButton.addEventListener("click", async () => {
      if (!playing) {
        try {
          statusText.textContent = "Connecting...";

          await radio.play();

          playing = true;
          playButton.textContent = "❚❚";
          playButton.setAttribute("aria-label", "Pause radio");
          statusText.textContent = "Live now";
        } catch (error) {
          playing = false;
          playButton.textContent = "▶";
          statusText.textContent = "Unable to connect. Tap to try again.";
        }
      } else {
        radio.pause();

        playing = false;
        playButton.textContent = "▶";
        playButton.setAttribute("aria-label", "Play radio");
        statusText.textContent = "Paused";
      }
    });

    radio.addEventListener("playing", () => {
      playing = true;
      playButton.textContent = "❚❚";
      statusText.textContent = "Live now";
    });

    radio.addEventListener("waiting", () => {
      statusText.textContent = "Connecting...";
    });

    radio.addEventListener("error", () => {
      playing = false;
      playButton.textContent = "▶";
      statusText.textContent = "Stream unavailable. Tap to retry.";
    });

    /*
      SONG TITLE DISPLAY

      The player is ready to display:
      1. Song title
      2. Artist

      We will connect this section to the metadata supplied
      by the radio stream/server so it changes automatically
      whenever the song changes.
    */

    function updateSong(title, artistName) {
      songTitle.textContent =
        title || "Walking in the Light Radio";

      artist.textContent =
        artistName || "Live Stream";
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/sw.js")
          .catch(() => {});
      });
    }
  </script>

</body>
</html>
